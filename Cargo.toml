[package]
name = "cgts"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Gatekeeping facade of cvld: runs gates and collects gate results per community"
license = "FSL-1.1-ALv2"
repository = "https://git.corbet.ch/corbet-libs/cgts"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[dependencies]
cpmt = { git = "https://git.corbet.ch/corbet-foss/cpmt", branch = "main" }
cpns = { git = "https://git.corbet.ch/corbet-foss/cpns", branch = "main" }
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt", branch = "main" }
crbk = { git = "https://git.corbet.ch/corbet-foss/crbk", branch = "main" }
clbs = { git = "https://git.corbet.ch/corbet-foss/clbs", branch = "main" }
cgrd = { git = "https://git.corbet.ch/corbet-foss/cgrd", branch = "main", default-features = false }
cvch = { git = "https://git.corbet.ch/corbet-foss/cvch", branch = "main" }
cblc = { git = "https://git.corbet.ch/corbet-libs/cblc", branch = "main" }
cpsd = { git = "https://git.corbet.ch/corbet-foss/cpsd", branch = "main" }
rand = "0.8"
ed25519-dalek = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
# Build actual imported SQLite fixtures; production storage remains through crlt.
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
# Current cblc constructors still require the preceding upstream key type.
ed25519-dalek-v2 = { package = "ed25519-dalek", version = "2.2" }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", default-features = false, features = ["volatile-signer"] }
data-encoding = "2.9"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev.package."*"]
opt-level = 3

# Keep remaining transitive legacy URLs on the same current canonical source.
# These are source aliases, not version or commit pins.
[patch."https://github.com/corbet-foss/crlt"]
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt", branch = "main" }

[patch."https://github.com/corbet-foss/cpns"]
cpns = { git = "https://git.corbet.ch/corbet-foss/cpns", branch = "main" }

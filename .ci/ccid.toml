schema = 1
project = "cgts"

[checks.verify]
cache_pure = false
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"], ["node", "--version"], ["python3", "--version"]]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt", "dependency-metadata.json", "release-probe.log"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories"]]

[render]
tool_revision = "2db9dddd5e43d48b6cdbb2728818957db65acf5e"
tool_sha256 = "f5a672c714ca91a87e230713086379f06ad6df6d0ccd9112ee5fbf0cd44f95e7"

[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["verify", "advisories"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]

# Resolve once on Crow, then review and retain the lock before full verification.
[checks.resolve-dependencies]
kind = "commands"
commands = [["bash", ".ci/resolve-dependencies.sh"]]
cache = false
cache_outputs = ["Cargo.lock", "dependency-metadata.json"]

[jobs.resolve-dependencies]
scheduler = "forgejo"
runs_on = "heavy"
events = ["manual"]
checks = ["resolve-dependencies"]
workflow = "resolve"
command = ["bash", ".ci/run-cached.sh"]
